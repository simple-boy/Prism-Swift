name: prism-swift
services:
  memory:
    image: prism-swift:${IMAGE_TAG:-0.1.0}
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unfixed}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
        SWIFT_PIP_INDEX: ${SWIFT_PIP_INDEX:-https://pypi.org/simple}
    container_name: prism-swift
    env_file:
      - .env
    environment:
      MEMORY_DB_PATH: /app/data/swift.sqlite3
      PYTHONPATH: /app/src
      PRODUCTION: "1"
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PUBLIC_PORT:-8003}:8000"
    volumes:
      - swift_data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEMORY_LIMIT:-1024m}
    cpus: ${CPU_LIMIT:-1.5}
    pids_limit: 128
    stop_grace_period: 30m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  swift_data:
    name: prism_swift_data
